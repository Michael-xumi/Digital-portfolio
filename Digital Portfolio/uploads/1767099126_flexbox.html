<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="flexbox.css">
</head>

<body>

    <p>Flexbox</p><br>

    <div class="flexbox-container">
        <div id="box" class="item-1">Item 1</div>
        <div id="box" class="item-2">Item 2</div>
        <div id="box" class="item-3">Item 3</div>
        <div id="box" class="item-4">Item 4</div>
        <div id="box" class="item-5">Item 5</div>
        <div id="box" class="item-6">Item 6</div>

    </div>


    <p>Grid Gallery</p>

    <div class="grid-container">
        <div class="griditem1">Item 1</div>
        <div class="griditem2">Item 2</div>
        <div class="griditem3">Item 3</div>
        <div class="griditem4">Item 4</div>
        <div class="griditem5">Item 5</div>
        <div class="griditem6"> Item 6</div>
    </div>


</body>

</html>
