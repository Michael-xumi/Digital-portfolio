name: Deploy to Xumi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Scanning the Tailscale IP
          ssh-keyscan -H 100.78.46.42 >> ~/.ssh/known_hosts

      - name: Sync and Restart
        run: |
          # Use 'user' as the username since that's what your terminal shows
          rsync -avz -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" --delete ./ user@100.78.46.42:/home/user/Digital-portfolio
          
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no user@100.78.46.42 "cd /home/user/Digital-portfolio && docker compose up -d --build"