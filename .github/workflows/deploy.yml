name: Deploy to Xumi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 100.78.46.42 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -avz -e "ssh -i /home/runner/.ssh/id_ed25519 -o StrictHostKeyChecking=no" --delete ./ Xumi@100.78.46.42:/home/Xumi/Digital-portfolio
          ssh -i /home/runner/.ssh/id_ed25519 -o StrictHostKeyChecking=no Xumi@100.78.46.42 "cd /home/Xumi/Digital-portfolio && docker compose up -d --build"