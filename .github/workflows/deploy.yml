name: Deploy to Xumi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale network
        run: |
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname github-actions

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 100.78.46.42 >> ~/.ssh/known_hosts

     - name: Deploy to server
        run: |
          # We use Xumi (the username) and point to a folder in the home directory
          rsync -avz --delete ./ Xumi@100.78.46.42:/home/Xumi/Digital-portfolio
          
          # Optional: Tell Docker to refresh the containers with the new code
          ssh Xumi@100.78.46.42 "cd /home/Xumi/Digital-portfolio && docker compose up -d --build"